# Optional API service using the published GHCR image.
# Start infra first: docker compose -f deployments/docker-compose.yml up -d
# Then: docker compose -f deployments/docker-compose.yml -f deployments/docker-compose.api.yml up -d api
services:
  api:
    image: ghcr.io/${GHCR_OWNER:-thanhtai9606}/docforge-api:${API_IMAGE_TAG:-latest}
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://docforge:docforge@postgres:5432/docforge?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://docforge:docforge@rabbitmq:5672/
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: docforge
      S3_ACCESS_KEY: docforge
      S3_SECRET_KEY: docforge_secret
      S3_USE_PATH_STYLE: "true"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
